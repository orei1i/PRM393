name: veganlife_mobile
description: VeganLife — AI vegan nutrition, community & chef consultation (Flutter client).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (manual providers, no codegen; code is also Riverpod 3 compatible)
  flutter_riverpod: ^2.6.1
  # Networking
  dio: ^5.7.0
  # Local storage (session, guest token)
  shared_preferences: ^2.3.2
  # UI
  google_fonts: ^6.2.1
  flutter_markdown_plus: ^1.0.0
  url_launcher: ^6.3.0
  # Device / media
  camera: ^0.11.0+2
  video_player: ^2.9.2
  image_picker: ^1.2.3
  # Maps: OpenStreetMap tiles, markers, route polylines (approved)
  flutter_map: ^8.3.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
